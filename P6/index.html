<html>
  <head>
    <title>Parcel Sandbox</title>
    <meta charset="UTF-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh; /* Ocupa toda la altura de la ventana */
        background-color: #000; /* Fondo negro para inmersión */
        display: flex;
        justify-content: center; /* Centrado horizontal */
        align-items: center; /* Centrado vertical */
        overflow: hidden; /* Evita barras de desplazamiento */
      }
      
      #app {
        position: relative; 
        width: 800px;
        height: 600px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); /* Sombra para resaltar el marco del juego */
      }

      #miCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #111; /* Fondo oscuro por si la imagen tarda en cargar */
      }

      .imagen-capa {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <canvas id="miCanvas" width="800" height="600"></canvas>
      <img src="Nave.png" class="imagen-capa" alt="Cabina superpuesta" />
    </div>
    <script type="module" src="src/index.js"></script>
  </body>
</html>
