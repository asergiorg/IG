<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Sistema solar</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="app">
      <div class="controles">
        <div class="control-fila">
          <label class="switch">
            <input type="checkbox" id="toggleCabina" checked>
            <span class="slider"></span>
          </label>
          <span>Mostrar cabina</span>
        </div>
        <div class="control-fila">
          <label class="switch">
            <input type="checkbox" id="toggleTutorial" checked>
            <span class="slider"></span>
          </label>
          <span>Mostrar tutorial</span>
        </div>
      </div>

      <canvas id="miCanvas" width="800" height="600"></canvas>
      
      <img id="imagenCabina" src="images/Nave.png" class="imagen-capa" alt="Cabina superpuesta" />
      <img id="tutorialNave" src="images/Controles nave.png" class="imagen-tutorial" alt="Tutorial Nave" />
      <img id="tutorialFuera" src="images/Controles sin cabina.png" class="imagen-tutorial" alt="Tutorial Fuera" style="display: none;" />
    </div>

    <script type="module" src="src/ui-logic.js"></script>
    <script type="module" src="src/index.js"></script>
  </body>
</html>
