<html>
  <head>
    <title>Sistema solar</title>
    <meta charset="UTF-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      
      #app {
        position: relative; 
        width: 800px;
        height: 600px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      }

      #miCanvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: #111;
      }

      .imagen-capa {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        z-index: 10;
        pointer-events: none;
      }

      /* Contenedor del control en la parte superior derecha */
      .controles {
        position: absolute;
        top: 15px; right: 15px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 15px;
        border-radius: 20px;
        color: white;
        font-family: sans-serif;
        font-size: 14px;
      }

      /* Estilos del Switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 20px;
      }
      .switch input { opacity: 0; width: 0; height: 0; }
      
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #777;
        transition: .3s;
        border-radius: 20px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 14px; width: 14px;
        left: 3px; bottom: 3px;
        background-color: white;
        transition: .3s;
        border-radius: 50%;
      }
      
      input:checked + .slider { background-color: #2196F3; }
      input:checked + .slider:before { transform: translateX(20px); }
    </style>
  </head>

  <body>
    <div id="app">
      <!-- Panel de controles -->
      <div class="controles">
        <label class="switch">
          <input type="checkbox" id="toggleCabina" checked>
          <span class="slider"></span>
        </label>
        <span>Mostrar cabina</span>
      </div>

      <canvas id="miCanvas" width="800" height="600"></canvas>
      <img id="imagenCabina" src="Nave.png" class="imagen-capa" alt="Cabina superpuesta" />
    </div>

    <!-- Script para ocultar/mostrar la imagen -->
    <script type="module">
      const toggle = document.getElementById('toggleCabina');
      const cabina = document.getElementById('imagenCabina');

      toggle.addEventListener('change', (e) => {
        cabina.style.display = e.target.checked ? 'block' : 'none';
      });
    </script>
    <script type="module" src="src/index.js"></script>
  </body>
</html>
